{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web.fullname" . }}-secret
  labels:
    {{- include "web.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PLACEHOLDERS by default — override at install time, never commit real values.
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
