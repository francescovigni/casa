image:
  repository: ghcr.io/francescovigni/website
  # Pin by digest in production for reproducible, rollback-safe deploys.
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 4321
  # Scoped to loopback by a kube-proxy policy; Caddy is the retained TLS edge.
  nodePort: 30080

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: "500m"
    memory: 256Mi

# Non-secret runtime config (ConfigMap).
config:
  TWENTY_LEAD_STAGE: "NEW"
  LEAD_FALLBACK_EMAIL: "hello@francescovigni.com"

# Name of a Secret you manage yourself. Set it and the chart renders no Secret
# of its own, so credentials never pass through Helm (and never show up in
# `helm get values`). Create it from an env file on the host:
#
#   cp deploy/web.env.example /root/web.env && chmod 600 /root/web.env   # then edit
#   kubectl create secret generic web-env --from-env-file=/root/web.env \
#     --dry-run=client -o yaml | kubectl apply -f -
#   helm upgrade --install web ./deploy/helm --set existingSecret=web-env ...
#
# Leave it empty to let the chart manage the Secret from `secrets` below.
existingSecret: ""

# Secrets: placeholders, used only when existingSecret is empty. Provide real
# values at install time; never commit tokens.
secrets:
  TWENTY_API_URL: ""
  TWENTY_API_TOKEN: "changeme"
  SMTP_URL: ""

probes:
  path: /
  port: 4321
