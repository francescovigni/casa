name: Image

# Builds the container on a native amd64 runner and pushes it to ghcr.
# Building locally on an arm64 Mac produces an arm64-only image that the
# amd64 VPS cannot pull, which is exactly how this workflow came to exist.

on:
  push:
    branches: [main, astro-rebuild]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. 2026-09-14)"
        required: false
        type: string

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/francescovigni/website:${GITHUB_SHA::7}"
            echo "ghcr.io/francescovigni/website:latest"
            [ -n "${{ inputs.tag }}" ] && echo "ghcr.io/francescovigni/website:${{ inputs.tag }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Deploy command
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "helm upgrade --install web ./deploy/helm --atomic --timeout 10m \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --set image.tag=${GITHUB_SHA::7} --set existingSecret=web-env" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
